<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>

    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">
</head>
<body class="bg-light">

    <main class="container mt-5">

        <div class="card">
            <div class="card-body">

                <div class="mb-3">

                    <label class="form-label">Novo Usuário</label>
                    <input 
                    type="text" 
                    id="inputNome" 
                    class="form-control" 
                    placeholder="Digite seu nome">
                </div>

                <button id="btnLogar" class="btn btn-primary">
                    Logar
                </button>

                <hr>

                <p id="mensagem" class="text-alert fw-bold"></p>

            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
